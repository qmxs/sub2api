name: Billing hotfix
on:
  push:
    branches: ['fix/claude-billing-*']
permissions:
  contents: read
  packages: write
concurrency:
  group: billing-hotfix-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Format check
        working-directory: backend
        run: |
          files=$(git diff-tree --no-commit-id --name-only -r HEAD | grep '\.go$' | sed 's|^backend/||')
          if [ -n "$files" ]; then gofmt -w $files; git diff --exit-code; fi
      - name: Billing regression tests
        working-directory: backend
        run: go test -p 2 -tags=unit ./internal/service ./internal/repository ./internal/handler -run 'ClaudeBilling|NewAPIBilling|PartialStreamUsage|SSEUsage|UsageBilling|UpstreamRequestID' -count=1 -timeout=15m
      - name: Compile application
        working-directory: backend
        run: go build -p 2 ./cmd/server
  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ghcr.io/qmxs/sub2api:billing-${{ github.sha }}
          build-args: |
            VERSION=0.2.15-billing-hotfix
            COMMIT=${{ github.sha }}
            GOPROXY=https://proxy.golang.org,direct
            GOSUMDB=sum.golang.org
          cache-from: type=gha
          cache-to: type=gha,mode=max
